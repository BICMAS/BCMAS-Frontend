# CFP AI service — Deployment (docs/ai/DEPLOYMENT_GUIDE.md §4).
#
# replicas: 1 and strategy: Recreate are deliberate. Learner memory, drafts, executions, audit and
# usage counters are in process memory, and SQLite workflow state must have a single writer. Do NOT
# scale out or add an HPA until durable shared stores exist (AI_OPERATIONS_GUIDE.md §8).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfp-ai-service
  labels: { app.kubernetes.io/name: cfp-ai-service, app.kubernetes.io/part-of: cfp }
spec:
  replicas: 1
  strategy: { type: Recreate }
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: cfp-ai-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cfp-ai-service, app.kubernetes.io/part-of: cfp }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /internal/metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45     # > uvicorn --timeout-graceful-shutdown 30 (streams finish)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ai-service
          image: REGISTRY/cfp-ai-service:RELEASE   # pin by digest in production
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: cfp-ai-config }
            - secretRef: { name: cfp-ai-secrets }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:   # let the load balancer observe the endpoint removal before shutdown starts
              exec: { command: ["python", "-c", "import time; time.sleep(5)"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: cfp-ai-data }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
