# TEMPLATE ONLY — do not fill in and commit. Create the real Secret from your secret manager, e.g.:
#   kubectl create secret generic cfp-ai-secrets \
#     --from-literal=ANTHROPIC_API_KEY="$(vault kv get -field=key secret/cfp-ai/anthropic)" \
#     --from-literal=CFP_AI_LOG_HASH_KEY="$(openssl rand -hex 32)" ...
# or use External Secrets / Sealed Secrets. This file is excluded from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: cfp-ai-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""            # required (or OPENAI_API_KEY with CFP_AI_OPENAI_DEFAULT_MODEL)
  CFP_AI_LOG_HASH_KEY: ""          # required: random, >= 32 bytes; rotating it breaks log correlation only
  CFP_AI_WEBHOOK_SECRET: ""        # backend → AI events (BE-080)
  CFP_AI_BACKEND_CLIENT_SECRET: "" # service identity (BE-003), with CFP_AI_BACKEND_CLIENT_ID
  CFP_AI_SENTRY_DSN: ""            # optional
