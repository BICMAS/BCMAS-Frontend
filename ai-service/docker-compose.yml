# Local development. Uses the in-process mock backend and dev tokens (see .env.example).
#   cp .env.example .env
#   docker compose up --build
# Then mint a token:  curl -X POST localhost:8000/v1/_dev/tokens -H 'content-type: application/json' -d '{"persona":"james"}'
services:
  ai-service:
    build:
      context: .
      target: dev
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src  # live reload
