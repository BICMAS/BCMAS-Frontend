# CFP AI Service — Backend Endpoint Registry
#
# STATUS: every endpoint below is PROPOSED and REQUIRES CONFIRMATION BY THE BACKEND TEAM.
# No backend API has been inspected: the frontend repository contains mock services only.
#
# This file is loaded by the AI service at startup (BackendEndpointRegistry). It is
# the single switch that decides whether the AI service may call an endpoint:
#
#   proposed   identified by the AI team; not agreed            → never called
#   confirmed  contract agreed in writing; not yet deployed      → never called
#   mocked     served by the contract-mock (dev/test only)       → called in dev/test only
#   available  deployed in this environment, contract tests pass → called
#   rejected   backend team declined; alternative needed         → never called
#
# A capability whose REQUIRED dependency is not callable is reported "unavailable" by
# GET /v1/capabilities; if only OPTIONAL dependencies are missing it is "degraded".
# Status changes are made by pull request, reviewed by both teams.
#
# Columns: id, method, path, caller, auth, purpose, used_by (capability codes; * = all),
#          status per environment, confirmed_by / confirmed_on / contract_ref when confirmed.

version: 1
environments: [dev, staging, prod]

endpoints:
  # ── Identity & access ────────────────────────────────────────────────────
  - id: BE-001
    method: GET
    path: /.well-known/jwks.json
    caller: ai_service
    auth: none
    purpose: Verify user / candidate / service JWT signatures
    used_by: ["*"]
    status: { dev: mocked, staging: proposed, prod: proposed }
  - id: BE-002
    method: POST
    path: /oauth/token  # grant_type=urn:ietf:params:oauth:grant-type:token-exchange
    caller: ai_service
    auth: user_token
    purpose: Optional on-behalf-of token exchange (RFC 8693) instead of forwarding user tokens
    used_by: ["*"]
    status: { dev: proposed, staging: proposed, prod: proposed }
  - id: BE-003
    method: POST
    path: /oauth/token  # grant_type=client_credentials
    caller: ai_service
    auth: none
    purpose: Service-account token for background indexing of tenant reference data
    used_by: [indexing]
    status: { dev: mocked, staging: proposed, prod: proposed }
  - id: BE-004
    method: GET
    path: /me
    caller: ai_service
    auth: user_token
    purpose: Resolve user_id ↔ employee_id and roles when not present in token claims
    used_by: ["*"]
    status: { dev: mocked, staging: proposed, prod: proposed }
  - id: BE-005
    method: GET
    path: /tenants/{tenant_id}/entitlements
    caller: ai_service
    auth: service_token
    purpose: Tenant AI entitlements and token budget (alternative to ai_entitlements claim)
    used_by: ["*"]
    status: { dev: mocked, staging: proposed, prod: proposed }
  - id: BE-006
    method: POST
    path: /talent/invites/{invite_token}/session
    caller: frontend
    auth: none
    purpose: Exchange a candidate invite token for a short-lived, assessment-scoped JWT
    used_by: [T2]
    status: { dev: mocked, staging: proposed, prod: proposed }

